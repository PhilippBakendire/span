function dateAtPoint(x,y){
 for(const row of document.querySelectorAll('.week-row')){const r=row.getBoundingClientRect();if(y>=r.top&&y<=r.bottom&&x>=r.left&&x<=r.right)return addDays(row.dataset.week,Math.min(6,Math.max(0,Math.floor((x-r.left)/(r.width/7)))));}

}
function onPointerDown(e){

 if(!button&&!cell)return;
 const day=dateAtPoint(e.clientX,e.clientY);if(!day)return;
 e.preventDefault();

  const original=gesture.original,diff=daysBetween(gesture.origin,hit),preview={...original};
  if(gesture.mode==='move'){preview.start=addDays(original.start,diff);preview.end=addDays(original.end,diff);}

});
document.addEventListener('pointerup',()=>{

 };
 dialog.querySelector('form').onsubmit=ev=>{
  ev.preventDefault();const data=new FormData(ev.target),title=String(data.get('title')).trim();
  try {const value=normalizeEvent({...e,title,type:data.get('type'),subject:data.get('subject'),start:data.get('start'),end:data.get('end'),color:selectedColor,due:checkbox.checked?data.get('due'):'',notes:String(data.get('notes')).trim(),completed:data.has('completed'),demo:false});
  change(()=>{if(current)state.events=state.events.map(old=>old.id===id?value:old);else state.events.push(value);},current?'A little update, saved.':'A little room, made.');dialog.close();}
  catch(error){$('#form-error').textContent=error.message;$('#form-error').hidden=false;}
 };
 if(current){$('#delete-event').onclick=()=>{change(()=>{state.events=state.events.filter(ev=>ev.id!==id);},'Plan removed.');dialog.close();};$('#duplicate-event').onclick=()=>{change(()=>{state.events.push({...e,id:crypto.randomUUID(),title:`${e.title} (copy)`,demo:false,completed:false});},'Plan duplicated.');dialog.close();};}
 if(!dialog.open)dialog.showModal();
 requestAnimationFrame(()=>$('#event-title').focus());
}
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});

function confirmExamples(){
 const dialog=$('#settings-dialog');
 dialog.innerHTML=`<div class="dialog-header"><div><p class="eyebrow">A FRESH START</p><h2 id="settings-title">Make it your own.</h2></div><button class="dialog-close" aria-label="Close">×</button></div><div class="settings-body"><p>Clear the example plans and start with a little breathing room. Any plans you’ve created or edited will stay.</p><div class="confirmation-buttons"><button class="secondary" id="keep-examples">Keep examples</button><button class="primary" id="confirm-clear">Clear examples</button></div></div>`;
 dialog.querySelector('.dialog-close').onclick=()=>dialog.close();$('#keep-examples').onclick=()=>dialog.close();$('#confirm-clear').onclick=()=>{change(()=>state.events=state.events.filter(e=>!e.demo),'Example plans cleared.');dialog.close();};dialog.showModal();
}
function downloadBackup(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`span-backup-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your backup is ready.');
}
function openSettings(section=''){
 const dialog=$('#settings-dialog');
 dialog.innerHTML=`<div class="dialog-header"><div><p class="eyebrow">JUST THE WAY YOU LIKE IT</p><h2 id="settings-title">Your little space.</h2></div><button class="dialog-close" aria-label="Close">×</button></div><div class="settings-body"><section class="settings-section"><h3>Make it feel like your week</h3><label class="settings-row">Week starts on<select id="week-start" class="form-input"><option value="1" ${state.weekStart===1?'selected':''}>Monday</option><option value="0" ${state.weekStart===0?'selected':''}>Sunday</option></select></label></section><section class="settings-section" id="subject-settings"><h3>Your subjects</h3><p>Filter by subject in the sidebar. Removing a subject keeps its plans.</p><div id="settings-subject-list">${state.subjects.map(s=>`<div class="settings-row"><span>${esc(s)}</span><button class="icon-button" data-remove-subject="${esc(s)}" aria-label="Remove ${esc(s)}">${icon('trash')}</button></div>`).join('')}</div><form id="subject-form" class="settings-row"><input class="form-input" id="new-subject" placeholder="A new subject…" maxlength="60" required aria-label="New subject name"><button class="secondary" type="submit">Add</button></form></section><section class="settings-section"><h3>A safe little copy</h3><p>Your plans are saved in this browser. Export a backup to keep a copy or move to another device. There’s no automatic cloud sync.</p><button class="secondary" id="export-backup">${icon('download')}Export backup</button><button class="secondary" id="import-backup">${icon('upload')}Restore backup</button><input id="backup-file" type="file" accept=".json,application/json" hidden><div id="import-confirm"></div><p class="warning">Restoring a backup replaces the plans in this browser. Export first if you want to keep both.</p></section><section class="settings-section"><h3>A few little shortcuts</h3><p><strong>N</strong> creates a plan · <strong>/</strong> finds a plan · <strong>Esc</strong> closes a window.<br>Drag a bar to move study time. Drag either edge to change its dates.<br>You can also edit every date by opening the plan.</p></section></div>`;
 dialog.querySelector('.dialog-close').onclick=()=>dialog.close();
 $('#week-start').onchange=ev=>{change(()=>state.weekStart=Number(ev.target.value),'Your week, updated.');};
 $('#subject-form').onsubmit=ev=>{ev.preventDefault();const name=$('#new-subject').value.trim();if(!name)return;if(state.subjects.some(s=>s.toLowerCase()===name.toLowerCase())){toast('That subject already has a little space.');return;}if(state.subjects.length>=30){toast('You can keep up to 30 subjects.');return;}change(()=>state.subjects.push(name),'Subject added.');openSettings('subjects');};
 dialog.querySelectorAll('[data-remove-subject]').forEach(b=>b.onclick=()=>{const name=b.dataset.removeSubject;change(()=>{state.subjects=state.subjects.filter(s=>s!==name);state.events=state.events.map(e=>e.subject===name?{...e,subject:''}:e);hiddenSubjects.delete(name);},'Subject removed. Its plans are still here.');openSettings('subjects');});
 $('#export-backup').onclick=downloadBackup;$('#import-backup').onclick=()=>$('#backup-file').click();
 $('#backup-file').onchange=async ev=>{
  const file=ev.target.files[0];if(!file)return;
  try{if(file.size>5*1024*1024)throw new Error('This file is too large. Choose a Span backup under 5 MB.');const restored=validateBackup(JSON.parse(await file.text()));
  $('#import-confirm').innerHTML=`<div class="confirm-box"><p>Restore ${restored.events.length} plans from this backup? This replaces your current plan.</p><div class="confirmation-buttons"><button class="secondary" id="cancel-restore">Cancel</button><button class="primary" id="confirm-restore">Restore plans</button></div></div>`;
  $('#cancel-restore').onclick=()=>$('#import-confirm').replaceChildren();$('#confirm-restore').onclick=()=>{change(()=>{state=restored;hiddenSubjects.clear();query='';},'Backup restored.');dialog.close();};
  }catch(error){toast(`Couldn’t restore: ${error instanceof SyntaxError?'This file is not valid JSON.':error.message}`);}
 };
 if(!dialog.open)dialog.showModal();
 if(section==='subjects')requestAnimationFrame(()=>$('#new-subject').focus());
}
render();
if(storageProblem)setTimeout(()=>toast('Your saved plan could not be read. Export a backup before closing this browser.'),500);
</script>
</head>
<body>
  <div id="app"></div>
  <dialog id="event-dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="drag-status" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
